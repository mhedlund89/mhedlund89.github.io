<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%231f5eff'/%3E%3C/svg%3E">
<title>Apply Tool</title>
<style>
:root{--bg:#f6f5f1;--panel:#fff;--ink:#16161a;--ink-3:#7a7a86;--line:#e2dfd6;--accent:#1f5eff;--accent-ink:#fff;--bad:#b42318;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111114;--panel:#19191e;--ink:#ececf1;--ink-3:#83838f;--line:#2c2c35;--accent:#6e95ff;--accent-ink:#0b0b10;--bad:#ff8a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111114;--panel:#19191e;--ink:#ececf1;--ink-3:#83838f;--line:#2c2c35;--accent:#6e95ff;--accent-ink:#0b0b10;--bad:#ff8a7a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
h1{font-size:18px;margin:0 0 16px;display:flex;align-items:center;gap:8px}
h1 i{width:10px;height:10px;border-radius:3px;background:var(--accent);display:inline-block}
label{display:block;font-size:12px;font-weight:600;margin:12px 0 4px}
.mask{-webkit-text-security:disc}
.box{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px}
input[type=text],input[type=password]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.row{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:13px}
button{margin-top:16px;width:100%;padding:10px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:600 14px inherit;cursor:pointer}
button:disabled{opacity:.6}
#err{color:var(--bad);font-size:13px;min-height:20px;margin-top:10px}
</style>
</head>
<body>
<!-- Deliberately not a <form> with a type=password field: that is what makes
     Chrome offer "Save password?" after unlocking. The password box is a text
     input masked with CSS, so password managers ignore it. -->
<div class="box" id="f" role="form">
  <h1><i></i>Apply Tool</h1>
  <label for="u">Username</label>
  <input type="text" id="u" autocomplete="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore autofocus>
  <label for="p">Password</label>
  <input type="text" id="p" class="mask" autocomplete="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore>
  <label class="row"><input type="checkbox" id="r" checked> Remember this device</label>
  <button type="button" id="b">Unlock</button>
  <div id="err" role="alert"></div>
</div>

const KEY_NAME = "applytool.key";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));

async function derive(user, pass){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(`${user.trim().toLowerCase()}:${pass}`), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function open(key){
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.data));
  const doc = new DOMParser().parseFromString(new TextDecoder().decode(plain), "text/html");
  document.documentElement.replaceWith(document.adoptNode(doc.documentElement));
  // Parsed scripts are inert; recreate them so they run.
  for (const old of document.querySelectorAll("script")) {
    const s = document.createElement("script");
    for (const a of old.attributes) s.setAttribute(a.name, a.value);
    s.textContent = old.textContent;
    old.replaceWith(s);
  }
}
function stored(){ try{ return localStorage.getItem(KEY_NAME) || sessionStorage.getItem(KEY_NAME); }catch{ return null; } }

(async () => {
  const raw = stored();
  if(raw){
    try{
      const [salt, k] = raw.split(".");
      if(salt !== PAYLOAD.salt) throw new Error("stale");
      const key = await crypto.subtle.importKey("raw", b64(k), "AES-GCM", false, ["decrypt"]);
      return await open(key);
    }catch{ try{ localStorage.removeItem(KEY_NAME); sessionStorage.removeItem(KEY_NAME); }catch{} }
  }
})();

// Browsers without -webkit-text-security get a normal password field instead.
if(!CSS.supports("-webkit-text-security","disc")) document.getElementById("p").type = "password";
document.getElementById("f").addEventListener("keydown", e => { if(e.key === "Enter") unlock(); });
document.getElementById("b").addEventListener("click", unlock);
async function unlock(){
  const btn = document.getElementById("b"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Unlocking…"; err.textContent = "";
  try{
    const key = await derive(document.getElementById("u").value, document.getElementById("p").value);
    const rawKey = toB64(await crypto.subtle.exportKey("raw", key));
    const remember = document.getElementById("r").checked;
    await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.data));
    document.getElementById("u").value = ""; document.getElementById("p").value = "";
    try{ (remember ? localStorage : sessionStorage).setItem(KEY_NAME, `${PAYLOAD.salt}.${rawKey}`); }catch{}
    await open(key);
  }catch{
    btn.disabled = false; btn.textContent = "Unlock"; err.textContent = "Wrong username or password.";
  }
}
</script>
